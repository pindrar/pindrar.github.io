<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pratama Indra Raswoko — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #f0f7ff;
      --bg2:       #e8f3fd;
      --bg3:       #ffffff;
      --surface:   rgba(255,255,255,0.7);
      --border:    rgba(14,116,189,0.15);
      --accent:    #0e74bd;
      --accent2:   #2196f3;
      --accent3:   #0ea5e9;
      --green:     #059669;
      --text:      #0f172a;
      --muted:     #475569;
      --radius:    16px;
      --radius-sm: 8px;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }
    body { background: linear-gradient(160deg, #f0f7ff 0%, #e8f3fd 50%, #dbeeff 100%) fixed; }
    ::selection { background: var(--accent); color: #fff; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ─── Scrollbar ─────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 99px; }

    /* ─── Canvas Background ─────────────────────────────────────────── */
    #canvas-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── Noise overlay ─────────────────────────────────────────────── */
    .noise {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* ─── Layout wrapper ─────────────────────────────────────────────── */
    .page { position: relative; z-index: 2; }

    /* ─── NAV ────────────────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      height: 68px;
      border-bottom: 1px solid transparent;
      transition: background 0.4s, border-color 0.4s, backdrop-filter 0.4s;
    }
    nav.scrolled {
      background: rgba(240,247,255,0.92);
      border-color: var(--border);
      backdrop-filter: blur(20px);
      box-shadow: 0 2px 20px rgba(14,116,189,0.08);
    }
    .nav-logo {
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }
    .nav-links a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      transition: color 0.2s;
      position: relative;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 2px;
      background: var(--accent2);
      border-radius: 99px;
      transition: width 0.3s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a:hover::after { width: 100%; }
    .nav-cta {
      padding: 8px 20px;
      background: var(--accent);
      color: #fff;
      border-radius: 99px;
      font-size: 0.875rem;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .nav-cta:hover {
      transform: translateY(-2px);
      background: var(--accent2);
      box-shadow: 0 8px 24px rgba(124,106,245,0.4);
    }

    /* ─── HERO ───────────────────────────────────────────────────────── */
    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 5% 80px;
      position: relative;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(14,116,189,0.1);
      border: 1px solid rgba(14,116,189,0.25);
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 28px;
      animation: fadeDown 0.8s ease both;
    }
    .hero-badge .dot {
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
      animation: pulse-dot 2s ease infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.6; transform: scale(1.4); }
    }
    .hero-name {
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1.08;
      margin-bottom: 12px;
      animation: fadeUp 0.9s 0.1s ease both;
    }
    .hero-name .grad {
      background: linear-gradient(135deg, #0e74bd 20%, #2196f3 60%, #0ea5e9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-title {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 28px;
      animation: fadeUp 0.9s 0.2s ease both;
    }
    .hero-title .tag {
      color: var(--accent2);
      font-weight: 700;
    }
    .hero-summary {
      max-width: 640px;
      font-size: clamp(0.9rem, 1.5vw, 1.05rem);
      color: var(--muted);
      margin-bottom: 44px;
      animation: fadeUp 0.9s 0.3s ease both;
    }
    .hero-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeUp 0.9s 0.4s ease both;
    }
    .btn-primary {
      padding: 14px 32px;
      background: var(--accent);
      color: #fff;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      background: var(--accent2);
      box-shadow: 0 16px 40px rgba(124,106,245,0.45);
    }
    .btn-secondary {
      padding: 14px 32px;
      border: 1px solid rgba(14,116,189,0.3);
      color: var(--accent);
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-secondary:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      background: rgba(14,116,189,0.08);
    }
    .hero-stats {
      display: flex;
      gap: 48px;
      margin-top: 72px;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeUp 0.9s 0.5s ease both;
    }
    .stat-item { text-align: center; }
    .stat-num {
      font-size: 2.2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .stat-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
      font-weight: 500;
    }
    .scroll-indicator {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.75rem;
      animation: fadeUp 1s 0.8s ease both;
    }
    .scroll-indicator .mouse {
      width: 24px; height: 36px;
      border: 2px solid var(--muted);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      padding-top: 6px;
    }
    .scroll-indicator .wheel {
      width: 4px; height: 8px;
      background: var(--accent);
      border-radius: 99px;
      animation: scroll-wheel 1.6s ease infinite;
    }
    @keyframes scroll-wheel {
      0%   { transform: translateY(0); opacity: 1; }
      80%  { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 0; }
    }

    /* ─── Section base ───────────────────────────────────────────────── */
    section { padding: 100px 5%; }
    .container { max-width: 1100px; margin: 0 auto; }
    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--accent2);
      margin-bottom: 12px;
    }
    .section-title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.2;
      margin-bottom: 16px;
    }
    .section-desc {
      max-width: 560px;
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 64px;
    }

    /* ─── Reveal animation ───────────────────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }

    /* ─── ABOUT ──────────────────────────────────────────────────────── */
    #about { background: linear-gradient(160deg, #e8f3fd, #f0f7ff); }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
    }
    .about-avatar-wrap {
      position: relative;
      display: flex;
      justify-content: center;
    }
    .about-avatar {
      width: 280px; height: 280px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 6rem;
      box-shadow: 0 0 80px rgba(14,116,189,0.25);
      position: relative;
      z-index: 1;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }
    .about-avatar::before {
      content: '';
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      border: 2px dashed rgba(14,116,189,0.35);
      animation: spin-slow 12s linear infinite;
    }
    @keyframes spin-slow { to { transform: rotate(360deg); } }
    .about-avatar::after {
      content: '';
      position: absolute;
      inset: -40px;
      border-radius: 50%;
      border: 1px dashed rgba(14,165,233,0.3);
      animation: spin-slow 20s linear infinite reverse;
    }
    .about-text .section-desc { margin-bottom: 32px; }
    .about-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      padding: 6px 14px;
      background: rgba(255,255,255,0.8);
      border: 1px solid rgba(14,116,189,0.2);
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent);
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
    }
    .chip:hover {
      border-color: var(--accent2);
      background: rgba(33,150,243,0.1);
      transform: translateY(-2px);
    }

    /* ─── EXPERIENCE ─────────────────────────────────────────────────── */
    #experience { background: #f0f7ff; }
    .timeline {
      position: relative;
      padding-left: 32px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, #0e74bd, #0ea5e9, rgba(14,165,233,0.1));
    }
    .timeline-item {
      position: relative;
      padding: 0 0 48px 40px;
    }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-dot {
      position: absolute;
      left: -6px; top: 4px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent2);
      border: 3px solid #f0f7ff;
      box-shadow: 0 0 12px rgba(14,116,189,0.4);
      transition: transform 0.3s;
    }
    .timeline-item:hover .timeline-dot {
      transform: scale(1.4);
      box-shadow: 0 0 20px rgba(14,116,189,0.7);
    }
    .timeline-card {
      background: #ffffff;
      border: 1px solid rgba(14,116,189,0.15);
      border-radius: var(--radius);
      padding: 28px 32px;
      box-shadow: 0 2px 12px rgba(14,116,189,0.06);
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
    }
    .timeline-card:hover {
      border-color: rgba(14,116,189,0.4);
      transform: translateX(6px);
      box-shadow: 0 12px 40px rgba(14,116,189,0.15), -4px 0 24px rgba(14,116,189,0.1);
    }
    .timeline-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .timeline-role {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .timeline-badge {
      padding: 3px 10px;
      background: rgba(14,116,189,0.1);
      border: 1px solid rgba(14,116,189,0.25);
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
    }
    .timeline-company-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .timeline-company {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--accent3);
    }
    .timeline-period {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .timeline-desc {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.7;
    }
    .timeline-highlights {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .highlight-tag {
      padding: 4px 10px;
      background: rgba(14,165,233,0.1);
      border: 1px solid rgba(14,165,233,0.25);
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #0284c7;
    }

    /* ─── SKILLS ─────────────────────────────────────────────────────── */
    #skills { background: linear-gradient(160deg, #e8f3fd, #f0f7ff); }
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 16px;
    }
    .skill-card {
      background: #ffffff;
      border: 1px solid rgba(14,116,189,0.15);
      border-radius: var(--radius);
      padding: 20px 12px;
      text-align: center;
      cursor: default;
      box-shadow: 0 2px 8px rgba(14,116,189,0.06);
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .skill-card:hover {
      transform: translateY(-6px) scale(1.03);
      border-color: var(--accent);
      box-shadow: 0 16px 40px rgba(14,116,189,0.2);
    }
    .skill-icon { font-size: 2rem; margin-bottom: 8px; }
    .skill-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
    }
    .skills-soft {
      margin-top: 48px;
    }
    .skills-soft-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .soft-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .soft-chip {
      padding: 8px 18px;
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(14,116,189,0.2);
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      transition: all 0.2s;
    }
    .soft-chip:hover {
      background: rgba(14,116,189,0.08);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* ─── PROJECTS ───────────────────────────────────────────────────── */
    #projects { background: #f0f7ff; }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    .project-card {
      background: #ffffff;
      border: 1px solid rgba(14,116,189,0.15);
      border-radius: var(--radius);
      padding: 32px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(14,116,189,0.07);
      transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
      cursor: default;
    }
    .project-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(14,116,189,0.05), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .project-card:hover::before { opacity: 1; }
    .project-card:hover {
      transform: translateY(-8px);
      border-color: rgba(14,116,189,0.4);
      box-shadow: 0 24px 60px rgba(14,116,189,0.15), 0 0 40px rgba(14,116,189,0.08);
    }
    .project-icon {
      font-size: 2.5rem;
      margin-bottom: 20px;
      display: block;
    }
    .project-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .project-desc {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.7;
    }
    .project-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .project-tag {
      padding: 4px 10px;
      background: rgba(14,116,189,0.08);
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
    }
    .featured-badge {
      position: absolute;
      top: 20px; right: 20px;
      padding: 4px 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      border-radius: 99px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ─── AWARDS ─────────────────────────────────────────────────────── */
    #awards { background: linear-gradient(160deg, #e8f3fd, #f0f7ff); }
    .awards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .award-card {
      background: #ffffff;
      border: 1px solid rgba(14,116,189,0.15);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(14,116,189,0.06);
      transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
    }
    .award-card:hover {
      transform: translateY(-6px);
      border-color: rgba(14,116,189,0.4);
      box-shadow: 0 20px 60px rgba(14,116,189,0.12);
    }
    .award-icon { font-size: 3rem; margin-bottom: 16px; }
    .award-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .award-desc {
      font-size: 0.875rem;
      color: var(--muted);
    }
    .award-period {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 12px;
      background: rgba(14,116,189,0.08);
      border: 1px solid rgba(14,116,189,0.2);
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
    }

    /* ─── EDUCATION & CERT ───────────────────────────────────────────── */
    #education { background: #f0f7ff; }
    .edu-cert-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }
    .edu-card, .cert-card {
      background: #ffffff;
      border: 1px solid rgba(14,116,189,0.15);
      border-radius: var(--radius);
      padding: 36px;
      box-shadow: 0 2px 12px rgba(14,116,189,0.06);
      transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
    }
    .edu-card:hover, .cert-card:hover {
      border-color: rgba(14,116,189,0.4);
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(14,116,189,0.12);
    }
    .edu-uni {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .edu-degree {
      font-size: 0.9rem;
      color: var(--accent3);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .edu-period {
      font-size: 0.85rem;
      color: var(--muted);
